# No auto-merge. Every Dependabot PR goes through the checks in .github/workflows and owner review.
version: 2
updates:
  # The root has no package.json; each JavaScript package has its own lockfile.
  - package-ecosystem: "npm"
    directories: ["/apps/web", "/apps/api", "/mcp", "/packages/shared"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
