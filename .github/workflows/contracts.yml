name: Contract security
on:
  pull_request:
    paths: ["contracts/**", "rust-toolchain.toml", ".github/workflows/contracts.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "rust-toolchain.toml", ".github/workflows/contracts.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-08
        with:
          toolchain: "1.97.0"
          targets: wasm32v1-none
          components: clippy, rustfmt
      # Official prebuilt binary pinned by checksum. Building from source needs system libs and ~10 min.
      - name: Install stellar-cli 28.1.0
        env:
          STELLAR_CLI_TGZ: stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
        run: |
          curl -sSfLO "https://github.com/stellar/stellar-cli/releases/download/v28.1.0/${STELLAR_CLI_TGZ}"
          echo "${STELLAR_CLI_SHA256}  ${STELLAR_CLI_TGZ}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar xzf "${STELLAR_CLI_TGZ}" -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
        working-directory: contracts
      - run: stellar contract build
        working-directory: contracts
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: contracts
      - run: cargo fmt --check
        working-directory: contracts
      - run: cargo test --locked
        working-directory: contracts
      # Workaround: cargo-scout-audit 0.3.17 builds dylint_driver 4.1.2, which clones
      # rust-clippy and checks out `master`; that branch was renamed `main`
      # (trailofbits/dylint#2153, fixed in dylint 6.3.0, not yet used by Scout).
      # Serve the clone from a local mirror that has `master`. Remove this step once
      # cargo-scout-audit ships with dylint >= 6.3.0.
      - name: Mirror rust-clippy with a master branch
        run: |
          git clone --bare --quiet https://github.com/rust-lang/rust-clippy "$RUNNER_TEMP/rust-clippy.git"
          git -C "$RUNNER_TEMP/rust-clippy.git" branch master main
          git -C "$RUNNER_TEMP/rust-clippy.git" symbolic-ref HEAD refs/heads/master
          git config --global url."file://$RUNNER_TEMP/rust-clippy.git".insteadOf https://github.com/rust-lang/rust-clippy
      - run: cargo install --locked cargo-scout-audit --version "0.3.17" && cargo scout-audit
        working-directory: contracts
