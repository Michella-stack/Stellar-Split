name: Node tests
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "packages/policy-engine/**"
      - "mcp/**"
      - ".github/workflows/node-tests.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Shared domain rules
        working-directory: packages/shared
        run: node --test "src/**/*.test.js"
      - name: Agent policy
        working-directory: packages/policy-engine
        run: node --test "src/**/*.test.js"
      - name: API (no dependencies)
        working-directory: apps/api
        run: node --test "test/*.test.js"
      - name: MCP server
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm test
      - name: MCP image builds and refuses requests without the token
        run: |
          docker build -t ledgerly-mcp mcp
          docker run -d --name mcp-smoke -p 127.0.0.1:8787:8787 \
            -e LEDGERLY_API_URL=https://api.example.test -e LEDGERLY_TOKEN=smoke -e MCP_AUTH_TOKEN=smoke ledgerly-mcp
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/mcp || true)
            [ "$code" = 401 ] && break
            sleep 1
          done
          docker logs mcp-smoke
          [ "$code" = 401 ]
