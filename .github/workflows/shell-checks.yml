name: Shell checks
on:
  pull_request:
    paths:
      - "scripts/**"
      - "supply-chain/**"
      - ".github/workflows/shell-checks.yml"
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check (bash -n)
        run: |
          find scripts supply-chain -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck (warning and above)
        run: |
          find scripts supply-chain -name '*.sh' -print0 | xargs -0 shellcheck -S warning
