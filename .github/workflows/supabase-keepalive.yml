name: Supabase keep-alive
# Free-tier projects pause after 7 days without activity. A real query twice a week prevents it.
on:
  schedule:
    - cron: "23 6 * * 1,4"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query the database
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "::error::Set repo secrets SUPABASE_URL and SUPABASE_ANON_KEY"; exit 1; }
          # RLS returns [] for anon: still a real Postgres query, which counts as activity.
          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/groups?select=id&limit=1"
