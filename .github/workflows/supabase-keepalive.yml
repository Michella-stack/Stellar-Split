name: Supabase keep-alive
# Free-tier projects pause after 7 days without enough activity. A read that RLS leaves empty did not count,
# so this calls keepalive() (database/migrations/007_keepalive.sql), which writes one row.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query the database
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "::error::Set repo secrets SUPABASE_URL and SUPABASE_ANON_KEY"; exit 1; }
          curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" -d '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive"
