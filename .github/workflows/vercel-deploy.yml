name: Deploy to Vercel
# Push to main: production deployment. Pull request from this repository: preview deployment.
# The build runs on Vercel and follows vercel.json. Needs three repository secrets:
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Without them the job skips and stays green.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: vercel-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    # Fork pull requests never get secrets, so they are not deployed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # vercel 64.5.0 was published 2026-10-16, past the 7 day cooldown of supply-chain/README.md.
      VERCEL_CLI: vercel@64.5.0
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets are not set on this repository, skipping the deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.enabled == 'true'
        with:
          node-version: "22"
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        env:
          IS_PROD: ${{ github.event_name == 'push' }}
        run: |
          flags=""
          [ "$IS_PROD" = "true" ] && flags="--prod"
          # shellcheck disable=SC2086
          url="$(npx --yes "$VERCEL_CLI" deploy $flags --yes --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        if: steps.secrets.outputs.enabled == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/v1/health"
      # TEMPORARY diagnosis, prints only lengths, matches and HTTP status codes. Remove after use.
      - name: Diagnose
        if: failure() && steps.secrets.outputs.enabled == 'true'
        run: |
          echo "token length: ${#VERCEL_TOKEN}"
          echo "org id length: ${#VERCEL_ORG_ID}, matches expected: $([ "$VERCEL_ORG_ID" = "team_mBzhC3YpoNFezzITJmlHxkGW" ] && echo yes || echo NO)"
          echo "project id length: ${#VERCEL_PROJECT_ID}, matches expected: $([ "$VERCEL_PROJECT_ID" = "prj_Pd2Kqezcg8u9hRV2GtwTASyFXIcG" ] && echo yes || echo NO)"
          api() { curl -s -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          echo "GET /v2/user: $(api /v2/user) user=$(jq -r '.user.username // .error.code' /tmp/out.json)"
          echo "GET /v2/teams: $(api /v2/teams) ids=$(jq -r '[.teams[]?.id] | join(",")' /tmp/out.json)"
          echo "GET project with team: $(api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID") $(jq -r '.error.code // "ok"' /tmp/out.json)"
          echo "GET project without team: $(api "/v9/projects/$VERCEL_PROJECT_ID") $(jq -r '.error.code // "ok"' /tmp/out.json)"
